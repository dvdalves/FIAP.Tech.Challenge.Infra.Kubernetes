name: CI/CD Pipeline - Kubernetes Infrastructure (Terraform)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  TERRAFORM_VERSION: "1.8.0"
  AZURE_REGION: "North Central US"
  STATE_RESOURCE_GROUP: "fiap-terraform-state-rg"
  STATE_STORAGE_ACCOUNT: "fiapdbtfstate2026"
  STATE_CONTAINER: "tfstate"
  STATE_KEY: "kubernetes/production.terraform.tfstate"

jobs:
  # ============================================================================
  # 1. VALIDAÇÃO DE CÓDIGO IAC (TERRAFORM)
  # ============================================================================
  terraform-validate:
    name: 🏗️ Terraform Format, Init & Validate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔍 Terraform Format Check
        run: terraform fmt -check

      - name: 🔍 Terraform Init
        run: terraform init -backend=false

      - name: 🔍 Terraform Validate
        run: terraform validate

  # ============================================================================
  # 2. TERRAFORM PLAN (PULL REQUESTS)
  # ============================================================================
  terraform-plan:
    name: 📝 Terraform Plan
    needs: terraform-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔑 Autenticar no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🗄️ Preparar backend remoto
        run: |
          az group create --name "$STATE_RESOURCE_GROUP" --location "$AZURE_REGION" --output none
          az storage account create --name "$STATE_STORAGE_ACCOUNT" --resource-group "$STATE_RESOURCE_GROUP" --location "$AZURE_REGION" --sku Standard_LRS --kind StorageV2 --allow-blob-public-access false --output none
          ACCOUNT_KEY=$(az storage account keys list --resource-group "$STATE_RESOURCE_GROUP" --account-name "$STATE_STORAGE_ACCOUNT" --query "[0].value" --output tsv)
          az storage container create --name "$STATE_CONTAINER" --account-name "$STATE_STORAGE_ACCOUNT" --account-key "$ACCOUNT_KEY" --output none

      - name: 📦 Terraform Init
        run: |
          ACCOUNT_KEY=$(az storage account keys list --resource-group "$STATE_RESOURCE_GROUP" --account-name "$STATE_STORAGE_ACCOUNT" --query "[0].value" --output tsv)
          terraform init -backend-config="resource_group_name=$STATE_RESOURCE_GROUP" -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" -backend-config="container_name=$STATE_CONTAINER" -backend-config="key=$STATE_KEY" -backend-config="access_key=$ACCOUNT_KEY"

      - name: 📋 Terraform Plan
        run: terraform plan -no-color

  # ============================================================================
  # 3. TERRAFORM APPLY (MERGE NA BRANCH PRINCIPAL)
  # ============================================================================
  terraform-apply:
    name: 🚀 Deploy AKS Cluster & Networking
    needs: terraform-validate
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔑 Autenticar no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🗄️ Preparar backend remoto
        run: |
          az group create --name "$STATE_RESOURCE_GROUP" --location "$AZURE_REGION" --output none
          az storage account create --name "$STATE_STORAGE_ACCOUNT" --resource-group "$STATE_RESOURCE_GROUP" --location "$AZURE_REGION" --sku Standard_LRS --kind StorageV2 --allow-blob-public-access false --output none
          ACCOUNT_KEY=$(az storage account keys list --resource-group "$STATE_RESOURCE_GROUP" --account-name "$STATE_STORAGE_ACCOUNT" --query "[0].value" --output tsv)
          az storage container create --name "$STATE_CONTAINER" --account-name "$STATE_STORAGE_ACCOUNT" --account-key "$ACCOUNT_KEY" --output none

      - name: 📦 Terraform Init
        run: |
          ACCOUNT_KEY=$(az storage account keys list --resource-group "$STATE_RESOURCE_GROUP" --account-name "$STATE_STORAGE_ACCOUNT" --query "[0].value" --output tsv)
          terraform init -backend-config="resource_group_name=$STATE_RESOURCE_GROUP" -backend-config="storage_account_name=$STATE_STORAGE_ACCOUNT" -backend-config="container_name=$STATE_CONTAINER" -backend-config="key=$STATE_KEY" -backend-config="access_key=$ACCOUNT_KEY"

      - name: 🔄 Importar Resource Group existente
        run: |
          if ! terraform state show azurerm_resource_group.main >/dev/null 2>&1; then
            terraform import azurerm_resource_group.main \
              "/subscriptions/$(az account show --query id -o tsv)/resourceGroups/fiap-tech-challenge-rg"
          fi
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          import_if_needed() {
            ADDRESS="$1"
            RESOURCE_ID="$2"
            if ! terraform state show "$ADDRESS" >/dev/null 2>&1 && az resource show --ids "$RESOURCE_ID" >/dev/null 2>&1; then
              terraform import "$ADDRESS" "$RESOURCE_ID"
            fi
          }
          BASE="/subscriptions/$SUBSCRIPTION_ID/resourceGroups/fiap-tech-challenge-rg"
          import_if_needed azurerm_log_analytics_workspace.main "$BASE/providers/Microsoft.OperationalInsights/workspaces/oficina-aks-cluster-logs"
          import_if_needed azurerm_virtual_network.main "$BASE/providers/Microsoft.Network/virtualNetworks/oficina-aks-cluster-vnet"
          import_if_needed azurerm_subnet.nodes "$BASE/providers/Microsoft.Network/virtualNetworks/oficina-aks-cluster-vnet/subnets/aks-nodes"
          import_if_needed azurerm_subnet.services "$BASE/providers/Microsoft.Network/virtualNetworks/oficina-aks-cluster-vnet/subnets/private-services"
          import_if_needed azurerm_public_ip.nat "$BASE/providers/Microsoft.Network/publicIPAddresses/oficina-aks-cluster-nat-ip"
          import_if_needed azurerm_nat_gateway.main "$BASE/providers/Microsoft.Network/natGateways/oficina-aks-cluster-nat"
          import_if_needed azurerm_network_security_group.nodes "$BASE/providers/Microsoft.Network/networkSecurityGroups/oficina-aks-cluster-nsg"

      - name: 🚀 Criar AKS e recursos base
        run: terraform apply -auto-approve -target=azurerm_kubernetes_cluster.main

      - name: 🔐 Configurar kubectl
        run: az aks get-credentials --resource-group fiap-tech-challenge-rg --name oficina-aks-cluster --overwrite-existing

      - name: 🚀 Aplicar observabilidade e recursos Kubernetes
        run: terraform apply -auto-approve
