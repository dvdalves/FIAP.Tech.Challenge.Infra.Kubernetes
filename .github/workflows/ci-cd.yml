name: CI/CD Pipeline - Kubernetes Infrastructure (Terraform)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

env:
  TERRAFORM_VERSION: "1.8.0"
  AZURE_REGION: "North Central US"

jobs:
  # ============================================================================
  # 1. VALIDAÇÃO DE CÓDIGO IAC (TERRAFORM)
  # ============================================================================
  terraform-validate:
    name: 🏗️ Terraform Format, Init & Validate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔍 Terraform Format Check
        run: terraform fmt -check

      - name: 🔍 Terraform Init
        run: terraform init -backend=false

      - name: 🔍 Terraform Validate
        run: terraform validate

  # ============================================================================
  # 2. TERRAFORM PLAN (PULL REQUESTS)
  # ============================================================================
  terraform-plan:
    name: 📝 Terraform Plan
    needs: terraform-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔑 Autenticar no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 📦 Terraform Init
        run: terraform init

      - name: 📋 Terraform Plan
        run: terraform plan -no-color

  # ============================================================================
  # 3. TERRAFORM APPLY (MERGE NA BRANCH PRINCIPAL)
  # ============================================================================
  terraform-apply:
    name: 🚀 Deploy AKS Cluster & Networking
    needs: terraform-validate
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'

    steps:
      - name: 📥 Checkout do Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Setup Terraform ${{ env.TERRAFORM_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: 🔑 Autenticar no Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 📦 Terraform Init
        run: terraform init

      - name: 🚀 Terraform Apply
        run: terraform apply -auto-approve
